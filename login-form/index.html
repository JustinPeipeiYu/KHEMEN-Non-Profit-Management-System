<!doctype html>

<html lang="en"> 

 <head> 

  <meta charset="UTF-8"> 

  <title>KHEMEN - Login Form using Html, CSS, JS</title> 

  <link rel="stylesheet" href="./style.css"> 

  <script src="./script.js" defer></script>

 </head> 

 <body> 

  <section> 
    
   <div class="signin"> 

    <div class="content"> 

     <h2 id="Title" >Sign In</h2> 

     <div class="form"> 

      <div class="inputBox"> 

       <input type="text" required> <i>Username</i> 

      </div> 

      <div class="inputBox"> 

       <input type="password" required> <i>Password</i> 

      </div> 

      <div class="clickableText"> <a href="javascript:void(0);" id="forgot">Forgot Password</a> <a href="www.example.com" id="signup">Sign up</a>

      </div> 

      <div class="inputBox"> 

       <input type="submit" value="Login"> 

      </div> 

     </div> 

    </div> 

   </div> 

  </section> 

 </body>

</html>
